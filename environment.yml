name: attentionsquared
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      # Installed inside the Conda environment; CUDA 12.8 wheels are selected on Linux.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.9.1
      - transformers==4.44.2
      - numpy==1.26.4
      - pandas==2.2.3
      - matplotlib==3.9.4
      - pytest==8.3.5
      - datasets==3.6.0
      - accelerate==1.14.0
      - pyyaml==6.0.2
      - sentencepiece==0.2.0
      - safetensors==0.5.3
      - einops==0.8.0
      - huggingface-hub==0.36.2
      - pyarrow==18.1.0
